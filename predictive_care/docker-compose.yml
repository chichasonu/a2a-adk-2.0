name: predictive-care

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Vector version (CARE_MEMORY_BACKEND=chroma).
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Knowledge-graph version (CARE_MEMORY_BACKEND=graph). Local demo credentials
  # only; override NEO4J_AUTH / NEO4J_PASSWORD for anything shared.
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-carepassword}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/7687"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  redis-data:
  mongo-data:
  chroma-data:
  neo4j-data:
