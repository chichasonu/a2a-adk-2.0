server:
  port: 8080

spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        name: adk-mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        type: SYNC
        tool-change-notification: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

# Optional API key / Bearer token auth for the MCP endpoint.
# Leave empty to disable auth. When set, clients must send:
#   Authorization: Bearer <mcp.api.key>
mcp:
  api:
    key: ${MCP_API_KEY:}

logging:
  level:
    org.springframework.ai.mcp: INFO
