[project]
name = "adk-setfit-router"
version = "0.1.0"
description = "BANKING77-trained SetFit intent router for an ADK supervisor with MCP-backed banking sub-agents over SSE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0.0,<3",
    "google-genai>=1.0.0",
    "mcp>=1.28.0,<2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "setfit>=1.1.0,<2",
    "sentence-transformers>=3.0.0",
    # datasets 4.x dropped loading-script support; PolyAI/banking77 is a script-based dataset.
    "datasets>=2.20.0,<4",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["setfit_router*", "training*", "benchmark*", "mcp_servers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
