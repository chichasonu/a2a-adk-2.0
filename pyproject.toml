[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-bq-compare"
version = "0.1.0"
description = "Compare Oracle and BigQuery tables at scale with DuckDB and datacompy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "datacompy>=0.14",
    "pandas>=2.0",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "oracledb>=2.0",
    "google-cloud-bigquery>=3.20",
    "google-cloud-bigquery-storage>=2.24",
    "google-auth>=2.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
oracle-bq-compare = "oracle_bq_compare.cli:main"

[tool.setuptools.packages.find]
include = ["oracle_bq_compare*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
