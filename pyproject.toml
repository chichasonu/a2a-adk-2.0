[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-adk-2-0"
version = "0.1.0"
description = "Google ADK 2.0 agent with route graphs, team agents, Redis SessionService, Runner and A2A AgentExecutor"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chichasonu"},
]
keywords = ["adk", "a2a", "agent", "google", "gemini", "redis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=2.0.0",
    "a2a-sdk[fastapi]>=1.0.0",
    "redis>=5.0.0",
    "fakeredis>=2.36.2,<2.37.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.28.0,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
memory = [
    "adk-redis[memory]>=0.0.5",
]
mongo = [
    "pymongo>=4.9,<5",
]
# Vector version of long-term memory (CARE_MEMORY_BACKEND=chroma). Pinned
# OpenTelemetry range keeps ChromaDB compatible with google-adk's ceiling.
vector = [
    "chromadb>=1.0,<2",
    "opentelemetry-api>=1.39,<=1.43",
    "opentelemetry-sdk>=1.39,<=1.43",
]
# Knowledge-graph version of long-term memory (CARE_MEMORY_BACKEND=graph).
graph = [
    "neo4j>=5.20,<6",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "adk-redis[memory]>=0.0.5",
    "pymongo>=4.9,<5",
]

[project.scripts]
a2a-adk = "a2a_adk.cli:main"
predictive-care = "predictive_care.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["a2a_adk*", "predictive_care*"]

[tool.setuptools.package-data]
predictive_care = ["ui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
