[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-demos"
version = "1.0.0"
description = "Six live demos of TypeSafe's Jev decision model vs OpenRouter LLMs (Python/FastAPI port)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "openai>=1.0",
    "typesafe-sdk>=0.7.1",
    "python-dotenv>=1.0",
]

[project.scripts]
jev-demos = "jev_demos.server:main"

[tool.ruff.lint]
# Broad excepts mirror the TypeScript catch-all handlers (simulated fallbacks, probe calls).
ignore = ["BLE001", "S110"]

[tool.setuptools]
packages = ["jev_demos"]
